# Rosé Pine Theme for Tmux Status Bar
set -g status "on"
set -g status-bg "colour234"  # Base (Background)
set -g status-justify "left"
set -g status-position "bottom"
set -g status-left-length "100"
set -g status-right-length "100"

# Left Status
set -g status-left "#{prefix_highlight}#[fg=colour32,bg=colour217,bold] #S #[fg=colour217,bg=colour234,nobold,nounderscore,noitalics]"

# Right Status
set -g status-right "#[fg=colour243,bg=colour234,nobold,nounderscore,noitalics]#[fg=colour255,bg=colour243] %d/%m/%Y %H:%M #[fg=colour245,bg=colour243,nobold,nounderscore,noitalics]#[fg=colour234,bg=colour245] #h "

# Window Status
setw -g window-status-separator ""
setw -g window-status-format "#[fg=colour243,bg=colour234] #I #[fg=colour243,bg=colour234]#W "
setw -g window-status-current-format "#[fg=colour234,bg=colour243,nobold,nounderscore,noitalics]#[fg=colour255,bg=colour243] #I #[fg=colour255,bg=colour243]#{?window_zoomed_flag,#[fg=colour159][],}#W #[fg=colour243,bg=colour234,nobold,nounderscore,noitalics]"

# Disable fucking ctrl+arrow keys
unbind-key C-Left
unbind-key C-Right
unbind-key C-Up
unbind-key C-Down
set-window-option -g xterm-keys on
set -ag terminal-overrides ",screen*:kLFT5=\eOD:kRIT5=\eOC:kUP5=\eOA:kDN5=\eOB:smkx@:rmkx@"

# tmux-resurrect
## Restore Vim sessions
set -g @resurrect-strategy-vim 'session'
## Restore Neovim sessions
set -g @resurrect-strategy-nvim 'session'
## Restore Panes
set -g @resurrect-capture-pane-contents 'on'
## Save sessions every 5 minutes
set -g @continuum-save-interval '5'
## Automatically save when tmux server is killed/detached (also on system shutdown/restart)
set-hook -g client-detached 'run-shell "~/.tmux/plugins/tmux-resurrect/scripts/save.sh"'

# tmux-continuum
set -g @continuum-boot 'on'
## Restore last saved environment (automatically)
set -g @continuum-restore 'on'

# Sesh Session Switcher - Ctrl+b + s to open FZF session picker
bind s display-popup -E "sesh connect \"\$(sesh list | fzf --height 40%)\""

# Floating Terminal - Ctrl+a + f for floating terminal popup
bind f display-popup -d "#{pane_current_path}" -w80% -h80% -E "zsh"

# Alternative floating terminal with smaller size - Ctrl+a + F
bind F display-popup -d "#{pane_current_path}" -w60% -h60% -E "zsh"

# FZF Window Switcher - Ctrl+a + w to open FZF window picker
bind w display-popup -E "tmux list-windows -a -F '#{session_name}:#{window_index}: #{window_name}' | fzf --height=40% --reverse --prompt='Select Window: ' | cut -d':' -f1,2 | xargs tmux switch-client -t"

# FZF Session + Window Switcher - Ctrl+a + W for sessions and windows combined
bind W display-popup -E "
(tmux list-sessions -F 'session:#{session_name}') && 
(tmux list-windows -a -F '#{session_name}:#{window_index}: #{window_name}') | 
fzf --height=40% --reverse --prompt='Select Session/Window: ' | 
sed 's/^session://' | cut -d':' -f1,2 | xargs tmux switch-client -t"

# Quick Window Renaming - Ctrl+a + , for rename with current path basename, Ctrl+a + . for custom rename
bind , command-prompt -I "#W" "rename-window '%%'"
bind . command-prompt -p "New window name:" "rename-window '%%'"

# Auto-rename windows based on current directory and running command
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}#{?#{==:#{pane_current_command},zsh},,: #{pane_current_command}}'

# Alternative format that always shows command (uncomment to use instead)
# setw -g automatic-rename-format '#{b:pane_current_path}: #{pane_current_command}'

# Manual keybinding to set window name to current directory
bind N run-shell 'tmux rename-window "$(basename "#{pane_current_path}")"'

# Manual keybinding to set window name to directory + command
bind M run-shell 'tmux rename-window "$(basename "#{pane_current_path}"): #{pane_current_command}"'

# Alternative: Set window name to current directory when creating new windows
bind C new-window -c "#{pane_current_path}" \; run-shell 'tmux rename-window "$(basename "#{pane_current_path}")"'

# List of plugins
# see this https://github.com/tmux-plugins/tpm to installation
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'rose-pine/tmux'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'


# The followings are not any kind of setting for Tmux, but crucial to my
# own productivity. Setting them up is really pain, and I probably going to
# forget it. So I'm just putting them here again.

######## iTerm + Tmux key integration #########
# First of all, iTerm can send hex codes for shortcuts you define. So for
# example you can send a hex code for the shortcut "c-f v" which in my case
# opens a vertical pane (see setting above). The hex code for this combination
# is: 0x06 0x76. There are many cases to find it out. One of them is the tool
# 'xxd'

# If you run "xxd -psd" and hit "c-f v" and then enter and finally c-c to exit
# , it outputs the following:
#
#       $ xxd -psd
#       ^Fv
#       06760a^C
#
# What matters is the sequence  06760a^C where:
#
#       06 -> c-f
#       76 -> v
#       0a -> return
#       ^C -> c-c
#
# From here, we know that 0x06 0x76 corresponds to "c-f v".
#
# Finally, inside the iTerm2 Key settings, I'm adding just various shortcuts,
# such as cmd-j, cmd-left, etc.. , select the option "send hex code" and the
# enter the hex code which I want to be executed, hence the tmux sequence. So
# when I press CMD + d in iterm, I send the sequence 0x06 0x76,
# which tmux inteprets it as opening a new pane.
###############################################

######## Alacritty + Tmux key integration #########
# First of all, Alacritty can send hex codes for shortcuts you define. So for
# example you can send a hex code for the shortcut "c-f v" which in my case
# opens a vertical pane (see setting above). The hex code for this combination
# is: 0x06 0x76. There are many cases to find it out. One of them is the tool
# 'xxd'

# If you run "xxd -psd" and hit "c-f v" and then enter and finally c-c to exit
# , it outputs the following:
#
#       $ xxd -psd
#       ^Fv
#       06760a^C
#
# What matters is the sequence  06760a^C where:
#
#       06 -> c-f
#       76 -> v
#       0a -> return
#       ^C -> c-c
#
# From here, we know that 0x06 0x76 corresponds to "c-f v".
#
# Next step is to add a line to 'key_binding' setting in Alacritty:
#
#   - { key: D,        mods: Command,       chars: "\x06\x76"  }
#
# That's it! The followings are the ones that I'm using:
#
#   key_bindings:
#     - { key: D,        mods: Command,       chars: "\x06\x76" }
#     - { key: D,        mods: Command|Shift, chars: "\x06\x73" }
#     - { key: W,        mods: Command,       chars: "\x06\x78" }
#     - { key: H,        mods: Command,       chars: "\x06\x68" }
#     - { key: J,        mods: Command,       chars: "\x06\x6a" }
#     - { key: K,        mods: Command,       chars: "\x06\x6b" }
#     - { key: L,        mods: Command,       chars: "\x06\x6c" }
#     - { key: T,        mods: Command,       chars: "\x06\x63" }
#     - { key: Key1,     mods: Command,       chars: "\x06\x31" }
#     - { key: Key2,     mods: Command,       chars: "\x06\x32" }
#     - { key: Key3,     mods: Command,       chars: "\x06\x33" }
#     - { key: Key4,     mods: Command,       chars: "\x06\x34" }
#     - { key: Key5,     mods: Command,       chars: "\x06\x35" }
#     - { key: Key6,     mods: Command,       chars: "\x06\x36" }
#     - { key: Key7,     mods: Command,       chars: "\x06\x37" }
#     - { key: Key8,     mods: Command,       chars: "\x06\x38" }
#     - { key: Key9,     mods: Command,       chars: "\x06\x39" }
#     - { key: Left,     mods: Command,       chars: "\x06\x48" }
#     - { key: Down,     mods: Command,       chars: "\x06\x4a" }
#     - { key: Up,       mods: Command,       chars: "\x06\x4b" }
#     - { key: Right,    mods: Command,       chars: "\x06\x4c" }
#
# Finally, inside the iTerm2 Key settings, I'm adding just various shortcuts,
# such as cmd-j, cmd-left, etc.. , select the option "send hex code" and the
# enter the hex code which I want to be executed, hence the tmux sequence. So
# when I press CMD + d in iterm, I send the sequence 0x06 0x76,
# which tmux inteprets it as opening a new pane.
###############################################
