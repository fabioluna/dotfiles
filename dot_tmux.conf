#INSTALL
# cp tmuxconf ~/.tmux.conf
#
# Prefix key (kept as default C-b)
set -g prefix C-b
bind C-b send-prefix

set-option -g default-shell /bin/zsh

# toogle last window by hitting again C-f
bind-key C-f last-window

# if multiple clients are attached to the same window, maximize it to the
# bigger one
set-window-option -g aggressive-resize

# Start windows and pane numbering with index 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# re-number windows when one is closed
set -g renumber-windows on

# word separators for automatic word selection
setw -g word-separators ' @"=()[]_-:,.'
setw -ag word-separators "'"

# Show times longer than supposed
set -g display-panes-time 2000

# tmux messages are displayed for 4 seconds
set -g display-time 4000

# {n}vim compatibility / truecolor
# Prefer tmux's own terminfo and enable truecolor where supported.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"

# Split horiziontal and vertical splits, instead of % and "
# Also open them in the same directory
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

# Switch between windows with CTRL+Number
bind-key -n C-1 select-window -t 1
bind-key -n C-2 select-window -t 2
bind-key -n C-3 select-window -t 3
bind-key -n C-4 select-window -t 4

# Enhanced window navigation
# Previous/Next window with wrapping
bind -r n next-window
bind -r p previous-window

# Move windows left/right
bind -r < swap-window -t -1\; select-window -t -1
bind -r > swap-window -t +1\; select-window -t +1

# Quick window creation and naming
bind c new-window -c "#{pane_current_path}" \; command-prompt -p "New window name:" "rename-window '%%'"

# Source file
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Clipboard integration
# Modern tmux/macOS generally doesn't require reattach-to-user-namespace.
# Let tmux-yank / pbcopy handle the clipboard.
set -g set-clipboard on

# Use vim keybindings in copy mode
setw -g mode-keys vi

# Update default binding of `Enter` and `Space to also use copy-pipe
unbind -T copy-mode-vi Enter
unbind -T copy-mode-vi Space

bind-key -T edit-mode-vi Up send-keys -X history-up
bind-key -T edit-mode-vi Down send-keys -X history-down

# setup 'v' to begin selection as in Vim
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
# copy text with `y` in copy mode
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel\; run "tmux save-buffer - | pbcopy >/dev/null 2>&1"
# bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel | $CLIP_TOOL

# copy text with mouse selection without pressing any key
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel \; run "tmux save-buffer - | pbcopy >/dev/null 2>&1"
# bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# emacs key bindings in tmux command prompt (prefix + :) are better than
# vi keys, even for vim users
set -g status-keys emacs

# focus events enabled for terminals that support them
set -g focus-events on

# Sync panes (Send input to all panes in the window). When enabled, pane
# borders become red as an indication.
bind C-s if -F '#{pane_synchronized}' \
                     'setw synchronize-panes off; \
                      setw pane-active-border-style fg=colour63,bg=default; \
                      setw pane-border-format       " #P "' \
                   'setw synchronize-panes on; \
                    setw pane-active-border-style fg=red; \
                    setw pane-border-format       " #P - Pane Synchronization ON "'

# Faster command sequence
set -s escape-time 0

# Have a very large history
set -g history-limit 1000000

# Mouse mode on
set -ag terminal-overrides ',xterm*:smcup@:rmcup@'
set -g @yank_selection_mouse 'clipboard'
set -g mouse on

# Set title
set -g set-titles on
set -g set-titles-string "#T"

# Equally resize all panes
bind-key = select-layout even-horizontal
# bind-key | select-layout even-vertical

# Resize panes
# bind-key -n Ô resize-pane -D 10
# bind-key -n  resize-pane -U 10
# bind-key -n Ó resize-pane -L 10
# bind-key -n Ò resize-pane -R 10
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Select panes
# NOTE(arslan): See to prevent cycling https://github.com/tmux/tmux/issues/1158
# bind-key -n ∆ select-pane -D
# bind-key -n ˚ select-pane -U
# bind-key -n ˙ select-pane -L
# bind-key -n ¬ select-pane -R
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R



# Disable confirm before killing
bind-key x kill-pane

